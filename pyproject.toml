[tool.poetry]
name = "sda-worktools"
version = "0.1.0"
description = "Local productivity tools for SDA/Copyright document workflows"
readme = "README.md"
authors = ["SDA Worktools Contributors"]
packages = [{ include = "document_filler", from = "apps/document_filler" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
PySide6 = "6.8.1"
docxtpl = "0.19.0"
python-docx = "1.1.2"
jinja2 = "3.1.4"

[tool.poetry.group.dev.dependencies]
ruff = "0.8.0"
pyyaml = "6.0.2"

[tool.poetry.scripts]
document-filler = "document_filler.main:run"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]