[tool.poetry]
name = "sda-worktools"
version = "0.1.0"
description = "Local productivity tools for SDA/Copyright document workflows"
readme = "README.md"
authors = ["SDA Worktools Contributors"]
packages = [{ include = "document_filler", from = "apps/document_filler" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.115.6"
uvicorn = { version = "0.32.1", extras = ["standard"] }
python-multipart = "0.0.17"
docxtpl = "0.19.0"
python-docx = "1.1.2"
jinja2 = "3.1.4"

[tool.poetry.group.dev.dependencies]
ruff = "0.8.0"
httpx = "0.28.0"

[tool.poetry.scripts]
document-filler = "document_filler.main:run"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]