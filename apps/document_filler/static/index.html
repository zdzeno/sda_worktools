<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDA Document Filler</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #1a1a1a;
        background: #f4f6f8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        background: #e8f0fe;
        color: #1a56db;
      }
      code {
        background: #f0f0f0;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="badge">Development placeholder</p>
      <h1>SDA Document Filler</h1>
      <p>
        This UI will collect form data, fill Word templates, and export
        <code>.docx</code>, PDF, or print output. Backend logic is not wired up yet.
      </p>
      <p id="status">Checking API…</p>
    </main>
    <script>
      fetch("/api/health")
        .then((r) => r.json())
        .then((data) => {
          document.getElementById("status").textContent =
            "API: " + data.status + " (" + data.service + ")";
        })
        .catch(() => {
          document.getElementById("status").textContent = "API unreachable.";
        });
    </script>
  </body>
</html>
